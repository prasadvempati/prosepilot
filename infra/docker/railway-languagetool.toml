[build]
builder = "dockerfile"
dockerfilePath = "infra/docker/languagetool.Dockerfile"

[deploy]
# Explicitly empty (not omitted): omitting this key entirely left Railway's
# dashboard "stuck" on the last value it had ever seen for this service
# (/v2/languages), because Railway's config-as-code treats a missing key as
# "no change" rather than "reset to default." An explicit empty string is
# required to actually clear/disable the healthcheck.
#
# Why we're disabling it: LanguageTool's embedded HTTP server doesn't
# reliably serve a no-argument endpoint that both (a) returns 2xx and
# (b) is actually reachable through Railway's health-checker (confirmed via
# deploy logs: "/" returns 400 without query params; "/v2/languages"
# received zero incoming requests at all across multiple deploys). This
# service is internal-only (reached via languagetool.railway.internal by
# the main API), and the container has booted reliably in ~1s across every
# deploy attempt, so skipping the healthcheck here is low-risk.
healthcheckPath = ""
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
