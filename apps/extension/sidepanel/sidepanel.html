<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      width: 360px; 
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
      background: #fafafa;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header { 
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); 
      color: white; 
      padding: 16px; 
      display: flex; 
      align-items: center; 
      gap: 8px;
      flex-shrink: 0;
    }
    .header svg { width: 24px; height: 24px; }
    .header h1 { font-size: 16px; font-weight: 600; }
    .content { flex: 1; padding: 16px; overflow-y: auto; }
    .status { 
      padding: 10px 12px; 
      border-radius: 8px; 
      font-size: 13px; 
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status.ready { background: #ecfdf5; color: #065f46; }
    .status.error { background: #fef2f2; color: #991b1b; }
    .status.info { background: #eff6ff; color: #1e40af; }
    .status-checking { background: #fef3c7; color: #92400e; }
    .btn { 
      width: 100%; 
      padding: 12px; 
      border: none; 
      border-radius: 10px; 
      font-size: 14px; 
      font-weight: 600; 
      cursor: pointer; 
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary { background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); color: white; }
    .btn-primary:hover { filter: brightness(1.05); transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secondary { background: #f3f4f6; color: #374151; margin-top: 8px; }
    .btn-secondary:hover { background: #e5e7eb; }
    .issues { margin-top: 16px; }
    .issue { 
      padding: 12px; 
      background: #f9fafb; 
      border-radius: 8px; 
      margin-bottom: 8px; 
      font-size: 13px; 
      border-left: 3px solid #6366f1;
      animation: slideIn 0.2s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .issue.accepted { border-left-color: #059669; background: #ecfdf5; }
    .issue.rejected { border-left-color: #9ca3af; background: #f3f4f6; opacity: 0.6; }
    .issue .category { 
      color: #6366f1; 
      font-weight: 600; 
      text-transform: uppercase; 
      font-size: 10px; 
      letter-spacing: 0.5px; 
      margin-bottom: 4px;
      display: inline-block;
    }
    .issue .original { 
      color: #dc2626; 
      text-decoration: line-through; 
      display: block; 
      margin: 6px 0; 
    }
    .issue .arrow { color: #9ca3af; display: inline-block; margin: 0 6px; }
    .issue .replacement { 
      color: #059669; 
      font-weight: 500; 
      display: block; 
      margin-bottom: 6px; 
    }
    .issue .explanation { 
      color: #6b7280; 
      font-size: 11px; 
      line-height: 1.4; 
    }
    .issue .actions { 
      display: flex; 
      gap: 6px; 
      margin-top: 8px; 
    }
    .issue .actions button { 
      flex: 1; 
      padding: 6px 10px; 
      border: none; 
      border-radius: 6px; 
      font-size: 11px; 
      font-weight: 500; 
      cursor: pointer; 
      transition: all 0.2s; 
    }
    .btn-accept { background: #dcfce7; color: #166534; }
    .btn-accept:hover { background: #bbf7d0; }
    .btn-reject { background: #fee2e2; color: #991b1b; }
    .btn-reject:hover { background: #fecaca; }
    .footer { 
      padding: 12px 16px; 
      border-top: 1px solid #e5e7eb; 
      font-size: 11px; 
      color: #9ca3af; 
      text-align: center;
    }
    .footer a { color: #6366f1; text-decoration: none; }
    #loading { display: none; text-align: center; padding: 20px; color: #6b7280; }
    #results { display: none; }
    .voice-score { 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      padding: 12px; 
      background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 100%); 
      border: 1px solid #bbf7d0; 
      border-radius: 10px; 
      margin-bottom: 12px; 
    }
    .voice-badge { 
      width: 56px; 
      height: 56px; 
      border-radius: 50%; 
      background: linear-gradient(135deg, #059669 0%, #10b981 100%); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      color: white; 
      font-weight: 700; 
      font-size: 18px; 
      flex-shrink: 0;
    }
    .voice-info { flex: 1; }
    .voice-info h4 { font-size: 13px; font-weight: 600; color: #065f46; margin-bottom: 2px; }
    .voice-info p { font-size: 11px; color: #166534; }
    .empty-state { 
      text-align: center; 
      padding: 24px 16px; 
      color: #9ca3af; 
    }
    .empty-state svg { width: 48px; height: 48px; margin-bottom: 8px; opacity: 0.5; }
    .empty-state p { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
    .empty-state .hint { font-size: 11px; color: #9ca3af; }
  </style>
</head>
<body>
  <div class="header">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
    </svg>
    <h1>ProsePilot</h1>
  </div>
  
  <div class="content">
    <div id="status" class="status ready">Ready to check</div>
    
    <!-- Voice Preservation Score -->
    <div id="voiceScoreSection" class="voice-score" style="display:none;">
      <div class="voice-badge">94%</div>
      <div class="voice-info">
        <h4>Your Voice Preserved</h4>
        <p>Most tools would change ~40% of your style. We keep you sounding like you.</p>
      </div>
    </div>
    
    <button id="checkBtn" class="btn btn-primary" onclick="checkSelection()">Check Selection</button>
    
    <div id="loading">Checking grammar...</div>
    <div id="results" class="issues"></div>
  </div>
  
  <div class="footer">
    <a href="https://prosepilot.io" target="_blank">ProsePilot</a> — Your Writing Co-Pilot
  </div>
  
  <script src="sidepanel.js"></script>
</body>
</html>
